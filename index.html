<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなでそっか！</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">

    <section id="titleScreen" class="screen active">
      <h1>みんなで<br>そっか！</h1>
      <p>RETRO SOKKA RHYTHM GAME</p>
      <button id="startButton">プレイスタート</button>
    </section>

    <section id="playScreen" class="screen">
      <div class="topBar">
        <button id="homeButton" class="smallButton">タイトルへ</button>
        <span>DJ MODE</span>
        <span id="timeText">00:00</span>
      </div>

      <div class="djArea">
        <img src="dj.gif" alt="DJ animation" class="djGif" />
      </div>

      <h2 id="trackTitle">♪ そっか</h2>

      <div class="progressOuter">
        <div id="progressBar" class="progressInner"></div>
      </div>

      <div class="noteLane">
        <div id="notesContainer"></div>
        <div class="judgeLine">SOKKA LINE</div>
      </div>

      <div id="cueText" class="cueText">READY</div>

      <button id="pushButton">そっか！</button>

      <div class="gaugeBox">
        <span>みんなでそっかゲージ</span>
        <div class="gaugeOuter">
          <div id="grooveGauge" class="gaugeInner"></div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <h1>RESULT</h1>
      <p id="resultScore"></p>
      <p id="resultRank"></p>

      <button id="retryButton">もう一回</button>
      <button id="resultHomeButton">タイトルへ</button>
    </section>

  </main>

  <audio id="music" src="track01.mp3"></audio>
  <audio id="sokkaSound" src="sokka.mp3"></audio>

  <script src="game.js"></script>
</body>
</html>
