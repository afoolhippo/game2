<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>みんなでそっか！</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main id="game">

    <!-- タイトル -->

    <section id="titleScreen" class="screen active">

      <img
        src="title.png"
        alt="みんなでそっか！"
        id="titleImage"
      />

      <p id="ruleText">
        タイミングよく<br>
        「そっか！」を決めよう！
      </p>

      <button id="startButton">
        タップしてスタート
      </button>

    </section>

    <!-- プレイ -->

    <section id="playScreen" class="screen">

      <button id="backButton">
        タイトルへ戻る
      </button>

      <div class="vinylArea">

        <div id="record" class="record">

          <img
            src="record.png"
            class="recordImg"
          />

          <img
            src="jacket01.png"
            class="labelImg"
          />

        </div>

        <img
          id="jacket"
          src="jacket01.png"
          class="jacket"
        />

      </div>

      <div class="trackInfo">

        <span id="trackTitle">
          ♪ そっか！
        </span>

        <span id="timeText">
          0:00 / 0:00
        </span>

      </div>

      <div id="cueText" class="cueText">
        INSERT VINYL
      </div>

      <button id="scratchButton">
        SCRATCH
      </button>

      <div class="gaugeBox">

        <span>盛り上がり</span>

        <div class="gaugeOuter">
          <div
            id="grooveGauge"
            class="gaugeInner"
          ></div>
        </div>

      </div>

    </section>

    <!-- リザルト -->

    <section id="resultScreen" class="screen">

      <h2 id="rankTitle">
        そっか見習い
      </h2>

      <img
        id="resultImage"
        src="result_bad.png"
        alt="result"
      />

      <div id="resultScore"></div>

      <div class="resultButtons">

        <button id="shareButton">
          Xでシェア
        </button>

        <button id="retryButton">
          もう1回遊ぶ
        </button>

        <button id="homeButton">
          カバゲーセンへ
        </button>

      </div>

    </section>

  </main>

  <audio id="music" src="track01.mp3"></audio>

  <audio id="scratchSound" src="scratch.mp3"></audio>
  <audio id="goodSound" src="good.mp3"></audio>
  <audio id="missSound" src="miss.mp3"></audio>

  <script src="game.js"></script>

</body>
</html>
