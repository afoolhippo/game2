<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなでそっか！</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">

    <section id="titleScreen" class="screen active">
      <div class="titleInner">
        <img
          id="titleLogo"
          class="titleLogo"
          src="title.png"
          alt="みんなでそっか！"
        />

        <p class="ruleText">
          「そっか！」のタイミングで<br>
          ボタンを押せ！<br>
          みんなでノろう！
        </p>

        <button id="startButton" class="mainButton">
          タップしてスタート
        </button>
      </div>
    </section>

    <section id="playScreen" class="screen">
      <button id="homeButton" class="backButton">
        タイトルへ
      </button>

      <div class="djArea">
        <img src="dj.gif" alt="DJ animation" class="djGif" />
      </div>

      <div class="trackRow">
        <h2 id="trackTitle">♪ そっか</h2>
        <span id="timeText">0:00 / 0:00</span>
      </div>

      <div class="noteLane">
        <div id="notesContainer"></div>
        <div class="judgeLine"></div>
      </div>

      <div id="cueText" class="cueText">READY</div>

      <button id="pushButton">そっか！</button>

      <div class="gaugeBox">
        <div class="gaugeLabel">ノリ</div>
        <div class="gaugeOuter">
          <div id="grooveGauge" class="gaugeInner"></div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="resultInner">

        <img
          id="resultCharacter"
          class="resultCharacter"
          src="result_normal.png"
          alt="結果キャラクター"
        />

        <h1 id="resultTitle" class="resultTitle">
          ノリノリそっか
        </h1>

        <p id="resultComment" class="resultComment"></p>

        <p id="resultScore" class="resultScore"></p>

        <div id="resultButtons" class="resultButtons hidden">

          <button id="shareButton" class="resultButton">
            Xでシェア
          </button>

          <button id="registerButton" class="resultButton">
            記録を登録
          </button>

          <button id="retryButton" class="resultButton">
            もう1回遊ぶ
          </button>

          <button id="arcadeButton" class="resultButton">
            カバゲーセンへ
          </button>

        </div>

      </div>
    </section>

  </main>

  <audio id="music" src="track01.mp3"></audio>
  <audio id="sokkaSound" src="sokka.mp3"></audio>

  <script src="game.js"></script>
</body>
</html>
